<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Arial, sans-serif">
  <!--
    Layout reference for the Break Room background (decision 0005; slice 23): every prop at its
    hotspot's exact bounds in src/content/breakRoom.ts, flat shapes only. Generated art follows this
    layout. Nothing here is a label: the only text is text that should be painted. What changes in
    play (the fridge open, Dana's locker open, the card stamped OUT) is an overlay, not part of the
    background: the fridge and lockers are painted shut.
  -->
  <!-- back wall, a scuffed skirting band, and the floor (walkable from y=420; it carries on under the inventory tray) -->
  <rect x="0" y="0" width="1280" height="420" fill="#cfc6a8"/>
  <rect x="0" y="330" width="1280" height="90" fill="#b8ad8c"/>
  <polygon points="0,420 1280,420 1280,720 0,720" fill="#8a8f96"/>

  <!-- Gift Shop door: x40-180 y140-420, STAFF ONLY on this side too -->
  <rect x="40" y="140" width="140" height="280" fill="#7a5a3a" stroke="#222" stroke-width="3"/>
  <rect x="60" y="170" width="100" height="40" fill="#e9e2c8" stroke="#222" stroke-width="2"/>
  <text x="110" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#a02020">STAFF ONLY</text>
  <circle cx="160" cy="290" r="7" fill="#d8c070" stroke="#222" stroke-width="2"/>

  <!-- noticeboard: x220-390 y170-290, pinned notices -->
  <rect x="220" y="170" width="170" height="120" fill="#b07a48" stroke="#222" stroke-width="3"/>
  <rect x="235" y="182" width="60" height="45" fill="#f7f3e3" transform="rotate(-4 265 204)"/>
  <rect x="305" y="185" width="70" height="35" fill="#fff59a" transform="rotate(3 340 202)"/>
  <rect x="245" y="235" width="55" height="45" fill="#bfe3ff"/>
  <rect x="315" y="230" width="60" height="50" fill="#f7f3e3" transform="rotate(-2 345 255)"/>

  <!-- time clock: x430-500 y200-300, card slot on top, a sign above, the card rack beside it -->
  <rect x="425" y="150" width="80" height="36" fill="#f7f3e3" stroke="#222" stroke-width="2"/>
  <rect x="430" y="200" width="70" height="100" rx="6" fill="#6d7a86" stroke="#222" stroke-width="3"/>
  <rect x="448" y="200" width="34" height="6" fill="#222"/>
  <circle cx="465" cy="240" r="22" fill="#f4f4ee" stroke="#222" stroke-width="2"/>
  <line x1="465" y1="240" x2="465" y2="224" stroke="#222" stroke-width="3"/>
  <line x1="465" y1="240" x2="477" y2="246" stroke="#222" stroke-width="3"/>
  <rect x="512" y="210" width="16" height="80" fill="#9a8a6a" stroke="#222" stroke-width="2"/>
  <g fill="#f3e9c6" stroke="#222" stroke-width="1">
    <rect x="514" y="204" width="12" height="18"/><rect x="514" y="232" width="12" height="18"/><rect x="514" y="260" width="12" height="18"/>
  </g>

  <!-- fridge, shut: x540-680 y150-420, freezer on top, handles on the right, covered in notes -->
  <rect x="540" y="150" width="140" height="270" rx="10" fill="#f2f4f2" stroke="#222" stroke-width="3"/>
  <line x1="540" y1="240" x2="680" y2="240" stroke="#222" stroke-width="3"/>
  <rect x="660" y="180" width="8" height="40" rx="3" fill="#888"/>
  <rect x="660" y="260" width="8" height="70" rx="3" fill="#888"/>
  <rect x="565" y="260" width="80" height="60" fill="#fff59a" stroke="#a02020" stroke-width="2" transform="rotate(-3 605 290)"/>
  <rect x="570" y="170" width="40" height="30" fill="#ffd0e0" transform="rotate(5 590 185)"/>
  <rect x="620" y="195" width="30" height="30" fill="#fff59a" transform="rotate(-8 635 210)"/>
  <rect x="580" y="340" width="45" height="35" fill="#bfe3ff" transform="rotate(-6 602 357)"/>
  <rect x="630" y="355" width="28" height="28" fill="#ffd0e0" transform="rotate(7 644 369)"/>

  <!-- vending machine: x720-850 y140-420, SNAX-O-RAMA, one bag of crisps stuck on its spiral, coin return -->
  <rect x="720" y="140" width="130" height="280" rx="6" fill="#c0392b" stroke="#222" stroke-width="3"/>
  <text x="768" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SNAX-O-RAMA</text>
  <rect x="735" y="160" width="80" height="190" fill="#2c3e50" stroke="#222" stroke-width="2"/>
  <line x1="735" y1="210" x2="815" y2="210" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="735" y1="260" x2="815" y2="260" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="735" y1="310" x2="815" y2="310" stroke="#7f8c8d" stroke-width="2"/>
  <rect x="760" y="270" width="30" height="36" fill="#7a3fa0" stroke="#222" stroke-width="2" transform="rotate(-12 775 288)"/>
  <rect x="823" y="170" width="18" height="60" fill="#ddd" stroke="#222" stroke-width="2"/>
  <rect x="823" y="245" width="18" height="18" rx="3" fill="#888" stroke="#222" stroke-width="2"/>
  <rect x="823" y="275" width="18" height="14" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="832" cy="284" r="3" fill="#c8783a"/>
  <rect x="740" y="370" width="70" height="30" fill="#222"/>

  <!-- lockers: x890-1120 y150-420. Three dented lockers, then a bare coat peg where a fourth would be:
       1 plain; 2 TRAINEE (Dana's) with a combination lock; 3 a gold star (Reginald's); 4 Gary's peg -->
  <rect x="890" y="150" width="172" height="270" fill="#4f7aa8" stroke="#222" stroke-width="3"/>
  <line x1="947" y1="150" x2="947" y2="420" stroke="#222" stroke-width="3"/>
  <line x1="1005" y1="150" x2="1005" y2="420" stroke="#222" stroke-width="3"/>
  <g fill="#2d4a6a">
    <rect x="900" y="165" width="38" height="5"/><rect x="900" y="175" width="38" height="5"/>
    <rect x="957" y="165" width="38" height="5"/><rect x="957" y="175" width="38" height="5"/>
    <rect x="1015" y="165" width="38" height="5"/><rect x="1015" y="175" width="38" height="5"/>
  </g>
  <ellipse cx="918" cy="330" rx="14" ry="9" fill="#3d628a"/>
  <rect x="958" y="200" width="38" height="16" fill="#f7f3e3"/>
  <text x="977" y="212" text-anchor="middle" font-size="9" font-weight="bold" fill="#222">TRAINEE</text>
  <circle cx="990" cy="290" r="9" fill="#d0d0d0" stroke="#222" stroke-width="2"/>
  <polygon points="1033,198 1037,208 1048,208 1039,214 1043,224 1033,218 1023,224 1027,214 1018,208 1029,208" fill="#f1c40f" stroke="#222" stroke-width="1"/>
  <rect x="1088" y="230" width="8" height="18" fill="#6a5030" stroke="#222" stroke-width="2"/>

  <!-- intercom: x1150-1210 y220-300, speaker grille and a red TALK button -->
  <rect x="1150" y="220" width="60" height="80" rx="6" fill="#7f8c8d" stroke="#222" stroke-width="3"/>
  <g fill="#222">
    <rect x="1162" y="232" width="36" height="4"/><rect x="1162" y="242" width="36" height="4"/><rect x="1162" y="252" width="36" height="4"/>
  </g>
  <rect x="1165" y="268" width="30" height="20" rx="4" fill="#e74c3c" stroke="#222" stroke-width="2"/>
</svg>
