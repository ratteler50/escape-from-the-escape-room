<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Layout reference for the Gift Shop background (decision 0005, slice 22): every prop at its
       hotspot's exact bounds in src/content/giftShop.ts, flat shapes only, like lair-layout.svg.
       Generated art follows this layout. Kyle and Mordecai are sprites, not part of the background:
       the wall behind the till and above the bargain bin stays empty for them.
       The <g id="notes"> group (dashed sprite boxes, Reginald's finale mark, labels) is for people
       reading this file; it's hidden in gift-shop-layout.png, the copy attached to ChatGPT. -->
  <!-- back wall: franchise purple, flat and bright under strip lights (the Lair is candlelit) -->
  <rect width="1280" height="720" fill="#8a6ab0"/>
  <!-- strip lights across the ceiling -->
  <g fill="#f4f8ff">
    <rect x="120" y="14" width="260" height="16"/><rect x="510" y="14" width="260" height="16"/>
    <rect x="900" y="14" width="260" height="16"/>
  </g>
  <!-- floor: the walkable area, and the strip under the inventory bar (shiny lino tiles) -->
  <polygon points="160,420 1120,420 1220,620 60,620" fill="#d8d0c0"/>
  <polygon points="0,420 160,420 60,620 0,620" fill="#c8c0b0"/>
  <polygon points="1120,420 1280,420 1280,620 1220,620" fill="#c8c0b0"/>
  <rect x="0" y="620" width="1280" height="100" fill="#b8b0a0"/>
  <!-- ESCAPE-O-RAMA banner, high on the middle of the wall, clear of Mordecai (y120 and down) -->
  <rect x="470" y="48" width="340" height="58" fill="#4a2a70"/>
  <circle cx="500" cy="77" r="20" fill="#efe6d0"/>
  <text x="655" y="88" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffd84a">ESCAPE-O-RAMA</text>
  <!-- Lair door: x40-180 y140-420, an arched dungeon door, the Lair's from this side -->
  <path d="M40,420 L40,200 Q110,120 180,200 L180,420 Z" fill="#5a3a20"/>
  <!-- EXIT THROUGH THE GIFT SHOP sign over the Lair door (its look line) -->
  <rect x="30" y="58" width="160" height="62" fill="#2a8a4a"/>
  <text x="110" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">EXIT THROUGH</text>
  <text x="110" y="106" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">THE GIFT SHOP</text>
  <!-- mug rack: x205-325 y190-380, three shelves of purple mugs, thin legs to the floor -->
  <rect x="205" y="190" width="120" height="190" fill="#c8a070"/>
  <rect x="210" y="380" width="8" height="40" fill="#8a6a40"/><rect x="312" y="380" width="8" height="40" fill="#8a6a40"/>
  <g fill="#6a3a9a">
    <rect x="215" y="205" width="28" height="32"/><rect x="251" y="205" width="28" height="32"/><rect x="287" y="205" width="28" height="32"/>
    <rect x="215" y="265" width="28" height="32"/><rect x="251" y="265" width="28" height="32"/><rect x="287" y="265" width="28" height="32"/>
    <rect x="215" y="325" width="28" height="32"/><rect x="251" y="325" width="28" height="32"/><rect x="287" y="325" width="28" height="32"/>
  </g>
  <!-- till: x365-505 y300-420, a shop counter; the register sits at its right end so Kyle,
       standing behind the counter's middle, is not hidden -->
  <rect x="365" y="300" width="140" height="120" fill="#6a4a8a"/>
  <rect x="465" y="262" width="40" height="38" fill="#3a3a40"/>
  <!-- bargain bin: x545-685 y330-420, a wire bin of junk; the teapot pokes out of the top middle, a yellow $2 sticker on it -->
  <rect x="545" y="330" width="140" height="90" fill="#c94a4a"/>
  <ellipse cx="615" cy="330" rx="26" ry="20" fill="#f0f0f8"/>
  <rect x="618" y="322" width="18" height="12" fill="#f8d040"/>
  <!-- cardboard Reginald: x725-795 y180-420, a flat cutout on a little easel foot -->
  <rect x="725" y="180" width="70" height="240" fill="#2a2a30"/>
  <circle cx="760" cy="205" r="16" fill="#efe6d0"/>
  <!-- STAFF ONLY: x870-990 y150-420, a grey metal door, the badge reader on the wall at its right -->
  <rect x="870" y="150" width="120" height="270" fill="#7a8a94"/>
  <rect x="885" y="175" width="90" height="34" fill="#f0f0f0"/>
  <text x="930" y="199" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#c02020">STAFF ONLY</text>
  <rect x="996" y="270" width="18" height="30" fill="#2a2a30"/><circle cx="1005" cy="279" r="4" fill="#ff3030"/>
  <!-- front door: x1040-1190 y140-420, a glass shop door, ajar, a sign taped to it -->
  <rect x="1040" y="140" width="150" height="280" fill="#4a7a5a"/>
  <rect x="1055" y="160" width="120" height="240" fill="#a8c8d8"/>
  <rect x="1070" y="250" width="90" height="50" fill="#f8f0d0"/>
  <g id="notes" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
    <!-- Kyle, waist-up behind the till: kyle.ts bounds 395,150 80x145 -->
    <rect x="395" y="150" width="80" height="145" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="435" y="225" fill="#222">KYLE (sprite)</text>
    <!-- Mordecai floating over the bin: mordecai.ts bounds 575,120 80x180 -->
    <rect x="575" y="120" width="80" height="180" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="615" y="210" fill="#222">MORDECAI</text>
    <!-- Reginald's finale mark: his feet at (833, 425); keep this floor clear -->
    <circle cx="833" cy="425" r="10" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="833" y="452" fill="#222">finale mark</text>
  </g>
</svg>
