<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No pinch or double-tap zoom: the game scales itself (slice 32). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#602b78" />
    <!-- Home screen: a manifest (Android) and Apple's own tags (iPhone, iPad). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Escape Room" />
    <title>Escape From the Escape Room</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      /* Touch: the game gets every gesture; no long-press menu, text selection or pull-to-refresh. */
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      /* "Turn your phone sideways", over the game on an upright phone (src/view/phone.ts). */
      #sideways { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 24px; padding: 32px; background: #15111f; color: #ffe28a; text-align: center;
        font: 700 20px/1.4 Nunito, 'Trebuchet MS', sans-serif; }
      #sideways[hidden] { display: none; }
      #sideways img { width: 112px; height: 112px; border-radius: 26px; animation: tilt 2.4s ease-in-out infinite; }
      #sideways p { margin: 0; max-width: 22em; }
      @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      #game { width: 100%; height: 100%; }
      /* The game's one font (slice 31), bundled: Nunito, SIL Open Font License (assets/fonts/OFL.txt). */
      @font-face {
        font-family: 'Nunito';
        src: url('assets/fonts/nunito-latin.woff2') format('woff2');
        font-weight: 200 1000;
        font-display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
